name: Build StudyPro APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract StudyPro ZIP
        run: |
          mkdir project
          unzip -o "StudyPro-10th-SSC-Android.zip" -d project

      - name: Find Android project
        id: project
        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Make Gradle executable
        run: chmod +x "${{ steps.project.outputs.dir }}/gradlew"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyPro-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
